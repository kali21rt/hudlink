[package]
name = "hudlink"
version = "2.1.0"
edition = "2021"
description = "hudlink daemon: streams system stats, media, lyrics, cava and weather to an ESP32 display"
license = "GPL-3.0-or-later"

# Sengaja tanpa dependency eksternal: build cepat, binary kecil, mudah dipelajari.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
