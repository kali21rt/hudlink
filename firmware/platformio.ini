; Aksara HUD firmware
; Board : ESP32 DevKit V1 (30 pin, USB-C)
; Layar : 2.8" TFT SPI 240x320 (ILI9341) + touch XPT2046

[env:esp32dev]
; core Arduino 2.0.x: paling stabil untuk TFT_eSPI di ESP32 klasik
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_build.f_cpu = 240000000L
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -O2
    -DUSER_SETUP_LOADED=1
    ; --- driver layar (ganti ke -DST7789_DRIVER=1 kalau warna/gambar aneh) ---
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; --- pin SPI (VSPI) ---
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTOUCH_CS=5
    ; --- font bawaan ---
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1
    ; --- kecepatan SPI (turunkan ke 27000000 kalau gambar glitch karena kabel jumper) ---
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
