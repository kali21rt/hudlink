name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build daemon
        working-directory: host
        run: cargo build --release
      - name: Build firmware
        working-directory: firmware
        run: |
          pip install platformio
          pio run
      - name: Collect files
        run: |
          mkdir dist
          cp host/target/release/hudlink dist/hudlink-x86_64-linux
          cp firmware/.pio/build/esp32dev/firmware.bin dist/hudlink-firmware.bin
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
